<!doctype html>
<!-- Stand-in for DoorLoop pages: only the elements the tours point at, with the same
     layout traps as the real app (collapsed side-menu section, scroll container
     wrapped in overflow: clip, widget below the fold, client-side navigation). -->
<html>
<head><title>Mock DoorLoop</title></head>
<body>
<nav>
  <button data-cy="global-search-trigger">Search</button>
  <button data-cy="SideMenu-CreateNewMenu-Button">Create new</button>
  <button data-intercom-target="nav-side-menu-main-people" aria-expanded="false" id="people">People</button>
  <div id="grp" style="height:0;overflow:hidden"><a data-cy="SideMenu-People-Tenants" href="/tenants">Tenants</a></div>
  <button data-cy="TrainingHubV2-DockButton">?</button>
  <!-- like DoorLoop's form fields: a decorative outline sits on top of the input and lets clicks through -->
  <div data-cy="mockField" style="position:relative;width:160px"><input aria-label="Mock field" style="width:100%"><fieldset style="position:absolute;inset:-4px;margin:0;pointer-events:none;border:1px solid #aaa"></fieldset></div>
</nav>
<!-- Like MUI's autocomplete: the field's options open in a popper mounted on <body>, at the overlay's z-index -->
<div role="presentation" id="mockPopper" hidden style="position:absolute;z-index:10000;background:#fff;border:1px solid #ccc"><ul role="listbox" style="margin:0;padding:4px"><li role="option" id="mockOption">Option A</li></ul></div>
<!-- Like DoorLoop's Create new: opens as the mouse button goes down, keeps focus inside, closes on a press outside or Escape -->
<div role="dialog" id="createDialog" hidden style="position:fixed;top:120px;left:320px;width:360px;background:#fff;border:1px solid #ccc;padding:12px;z-index:50">
  <input id="dialogSearch" placeholder="Search items to create">
  <div role="button" data-item-id="property" tabindex="0">Property</div>
</div>
<div style="height:100vh;overflow:clip">
  <main id="main" style="height:100vh;overflow-x:hidden;overflow-y:auto"></main>
</div>
<script>
  function render() {
    // like DoorLoop's New property wizard: a street field with suggestions, a checkbox, a choice, Cancel and Finish
    if (location.pathname === '/properties/new') {
      main.innerHTML = '<div data-cy="mockStreet" style="padding:4px;width:260px"><input aria-label="Street" aria-autocomplete="list" style="width:100%"></div>' +
        '<div data-cy="mockCity" style="width:260px"><input aria-label="City" style="width:100%"></div>' +
        '<div data-cy="mockCheck" style="width:120px"><span><input type="checkbox" aria-label="Federal"></span> Federal</div>' +
        '<button data-cy="mockChoice" aria-pressed="false">Single-Family</button>' +
        '<div style="margin-top:40px"><button data-cy="mockCancel">Cancel</button> <button data-cy="mockFinish">Finish</button></div>';
      wizard();
      return;
    }
    main.innerHTML = location.pathname === '/tenants'
      ? '<div data-cy="DetailScreen-ScreenTitle">Tenants</div><input aria-label="Search"><button aria-label="Filter">Filter</button><button aria-label="Columns">C</button><button aria-label="Export">E</button><button>New lease</button><div data-cy="list-engine-row">row</div>' +
        // like DoorLoop's bank and ownership choices: wrappers share a label, the buttons inside are unique
        '<div style="display:flex;gap:8px"><div data-cy="choiceWrap" style="padding:12px;border:1px solid #ccc"><button data-cy="Choice-A">A</button></div><div data-cy="choiceWrap" style="padding:12px;border:1px solid #ccc"><button data-cy="Choice-B">B</button></div></div>'
      : '<div data-cy="Widget-dashboards.thingsToDo" style="height:100px">todo</div><div style="height:1500px"></div><div data-cy="Widget-dashboards.occupancyRate" style="height:100px">occ</div>';
  }
  function wizard() {
    const street = document.querySelector('[aria-label=Street]');
    const city = document.querySelector('[aria-label=City]');
    street.addEventListener('input', () => {
      document.getElementById('streetPopper')?.remove();
      if (!street.value) return;
      const popper = Object.assign(document.createElement('div'), { id: 'streetPopper', role: 'presentation' });
      const r = street.getBoundingClientRect();
      popper.setAttribute('role', 'presentation');
      popper.style.cssText = `position:absolute;z-index:10000;background:#fff;border:1px solid #ccc;left:${r.left}px;top:${r.bottom + 30}px`;
      popper.innerHTML = '<ul role="listbox" style="margin:0;padding:4px"></ul>';
      for (const place of ['Sacramento, CA, 95838', 'Austin, TX, 78701']) {
        const li = Object.assign(document.createElement('li'), { role: 'option' });
        li.setAttribute('role', 'option');
        li.textContent = `${street.value}  ${place}`;
        li.onclick = () => { city.value = place.split(',')[0]; popper.remove(); };
        popper.firstChild.append(li);
      }
      document.body.append(popper);
    });
    const choice = document.querySelector('[data-cy=mockChoice]');
    choice.onclick = () => choice.setAttribute('aria-pressed', 'true');
    document.querySelector('[data-cy=mockFinish]').onclick = () => (main.dataset.saved = 'yes');
    document.querySelector('[data-cy=mockCancel]').onclick = () => {
      document.body.dataset.cancelled = 'yes';
      history.pushState({}, '', '/home');
      render();
    };
  }
  render();
  window.addEventListener('popstate', render);
  const createBtn = document.querySelector('[data-cy="SideMenu-CreateNewMenu-Button"]');
  const mockInput = document.querySelector('[aria-label="Mock field"]');
  mockInput.addEventListener('focus', () => {
    const r = mockInput.getBoundingClientRect();
    Object.assign(mockPopper.style, { left: r.left + scrollX + 'px', top: r.bottom + scrollY + 40 + 'px' });
    mockPopper.hidden = false;
  });
  mockOption.addEventListener('click', () => { mockInput.value = 'Option A'; mockPopper.hidden = true; });
  const dialog = document.getElementById('createDialog');
  createBtn.addEventListener('mousedown', () => { dialog.hidden = false; dialogSearch.focus(); });
  document.addEventListener('focusin', (e) => { if (!dialog.hidden && !dialog.contains(e.target)) dialogSearch.focus(); });
  // Like Radix's focus trap: when focus leaves the dialog for something else, take it straight back
  document.addEventListener('focusout', (e) => {
    if (!dialog.hidden && dialog.contains(e.target) && e.relatedTarget && !dialog.contains(e.relatedTarget)) dialogSearch.focus();
  });
  document.addEventListener('pointerdown', (e) => { if (!dialog.hidden && !dialog.contains(e.target) && e.target !== createBtn) dialog.hidden = true; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') dialog.hidden = true; }); // like a real router: back/forward and pushState + popstate re-render
  people.onclick = () => { grp.style.height = 'auto'; people.setAttribute('aria-expanded', 'true'); };
  document.querySelector('[data-cy="SideMenu-People-Tenants"]').onclick = (e) => {
    e.preventDefault();
    history.pushState({}, '', '/tenants');
    render();
  };
</script>
</body>
</html>
